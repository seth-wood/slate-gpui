[package]
name = "slate-gmail"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "form", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
thiserror = "2"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
url = "2"

[dev-dependencies]
wiremock = "0.6"
